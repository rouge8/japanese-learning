[tools]
rust = { version = "1.98.1", components = [
  "rust-src",
  "rustfmt",
  "clippy",
  "llvm-tools",
  "rust-analyzer",
] }
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
flyctl = "latest"

[tasks.setup]
run = "true"

[tasks.upgrade-deps]
run = "cargo update"

[tasks.test]
run = "cargo nextest run"
