[package]
name = "wanikani-apprentice"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["macros"] }
axum-extra = { version = "=0.12.6", features = ["cookie-private"] }
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-humanize = "=0.2.3"
dotenvy = "=0.15.7"
envy = "=0.4.2"
futures = "=0.3.34"
git-version = "=0.3.9"
http-body-util = "=0.1.5"
hyper = "=1.11.1"
include_dir = "=0.7.4"
mime_guess = "=2.0.5"
minijinja = { version = "=2.24.0" , features = ["loader"] }
once_cell = "=1.21.4"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", features = ["json", "query"] }
sentry = { version = "=0.49.2", features = ["tracing", "tower", "tower-axum-matched-path", "tower-http"] }
sentry-tower = { version = "=0.49.2", features = ["http", "axum-matched-path"] }
sentry-tracing = "=0.49.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
strum_macros = "=0.27.2"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.0", features = ["catch-panic", "trace", "fs", "compression-full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
mockito = "=1.7.2"
rstest = "=0.26.1"
similar-asserts = "=2.0.0"

[profile.release]
# Enable line numbers in Sentry
debug = 1
