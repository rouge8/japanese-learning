[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-extract-kanji"
authors = [{name = "Andy Freeland", email = "andy@andyfreeland.net"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]
dynamic = ["version", "description"]
requires-python = "~=3.14.0"
dependencies = [
    "anki==26.5",
    "click==8.4.2",
]

[dependency-groups]
dev = [
    "coverage==7.15.0",
    "pyrefly==1.2.0.dev2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.1.0",
]

[project.scripts]
anki-extract-kanji = "anki_extract_kanji.__main__:main"

[project.urls]
Home = "https://github.com/rouge8/anki-extract-kanji"

[tool.hatch.version]
path = "src/anki_extract_kanji/__init__.py"

[tool.pytest]
minversion = "9.0"
addopts = [
  "-v",
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.pyrefly]
preset = "strict"

[tool.ruff.lint.isort]
known-first-party = ["anki_extract_kanji"]
