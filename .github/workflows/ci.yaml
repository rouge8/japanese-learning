---

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: nightly-2026-09-15
          components: rustfmt
      - uses: jdx/mise-action@v5.2.6
        with:
          install: false
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: |
            wanikani-apprentice
      - uses: j178/prek-action@v3.0.0

  files-changed:
    name: Detect which files changed
    runs-on: ubuntu-latest

    outputs:
      python-projects: ${{ steps.projects.outputs.python}}
      wanikani-apprentice: ${{ steps.filter.outputs.wanikani-apprentice }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          list-files: json
          filters: |
            python:
              - 'anki-extract-kanji/**'
              - 'anki-newlines-to-br/**'
              - 'shirabe-jisho-to-anki/**'
              - 'wanikani-burnt-kanji-to-anki/**'
            wanikani-apprentice:
              - 'wanikani-apprentice/**'
      - name: Extract Python project names
        id: projects
        env:
          PYTHON_FILES: ${{ steps.filter.outputs.python_files }}
        run: |
          set -ex
          echo "$PYTHON_FILES" | jq -c 'map(split("/")[0]) | unique' > projects.json
          echo "python=$(cat projects.json)" >> $GITHUB_OUTPUT

  python:
    needs: files-changed
    if: needs.files-changed.outputs.python-projects != '[]'
    name: ${{ matrix.project }} (${{ matrix.toxenv }})
    runs-on: ubuntu-latest
    env:
      TOXENV: ${{ matrix.toxenv }}

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.files-changed.outputs.python-projects )}}
        toxenv:
          - py,test-coverage
          - pyrefly

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate the cache suffix
        id: cache-suffix
        run: |
          echo cache-suffix=${TOXENV//,/-} >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ${{ matrix.project }}/pyproject.toml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: ${{ matrix.project }}
          cache-suffix: ${{ steps.cache-suffix.outputs.cache-suffix }}
      - name: tox
        run: uvx tox -c ${{ matrix.project }}

  wanikani-apprentice:
    needs: files-changed
    if: needs.files-changed.outputs.wanikani-apprentice == 'true'
    name: wanikani-apprentice build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.82.7
        with:
          tool: cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.82.7
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: |
            wanikani-apprentice
      - name: Run tests
        run: cd wanikani-apprentice && cargo llvm-cov nextest --no-fail-fast --html --color=always
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: wanikani-apprentice/target/llvm-cov/html

  combined-results:
    needs:
      - prek
      - python
      - wanikani-apprentice
    if: always()
    name: Combined result
    runs-on: ubuntu-latest

    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs have failed!" && exit 1
