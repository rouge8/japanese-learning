[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shirabe_jisho_to_anki"
authors = [{name = "Andy Freeland", email = "andy@andyfreeland.net"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]
dynamic = ["version", "description"]
requires-python = "==3.15.2"

dependencies = [
  "anki==26.9.4",
  "attrs==26.1.0",
  "click==8.5.0",
  "lxml==6.1.3",
  "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "pyrefly==1.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-randomly==5.0.0",
    "pytest-unordered==0.8.0",
    "types-lxml==2026.2.16",
]

[project.scripts]
shirabe-jisho-to-anki = "shirabe_jisho_to_anki.__main__:main"

[project.urls]
Home = "https://github.com/rouge8/japanese-learning/tree/main/shirabe-jisho-to-anki"

[tool.hatch.version]
path = "src/shirabe_jisho_to_anki/__init__.py"

[tool.pytest]
minversion = "9.0"
addopts = [
  "-v",
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.pyrefly]
preset = "strict"
enable-fallback-search-path = true

[tool.ruff.lint.isort]
known-first-party = ["shirabe_jisho_to_anki"]
