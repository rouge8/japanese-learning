[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wanikani_burnt_kanji_to_anki"
authors = [{name = "Andy Freeland", email = "andy@andyfreeland.net"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]
dynamic = ["version", "description"]
requires-python = "==3.15.0"

dependencies = [
  "attrs==26.1.0",
  "click==8.5.0",
  "pyreqwest==0.15.0",
  "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "faker==40.28.1",
    "pytest-mock==3.16.0",
    "falcon==4.4.0",
    "pyrefly==1.4.0",
    "polyfactory==3.3.0",
]

[project.scripts]
wanikani-burnt-kanji-to-anki = "wanikani_burnt_kanji_to_anki.__main__:cli"

[project.urls]
Home = "https://github.com/rouge8/wanikani-burnt-kanji-to-anki"

[tool.hatch.version]
path = "src/wanikani_burnt_kanji_to_anki/__init__.py"

[tool.pytest]
minversion = "9.0"
addopts = [
  "-v",
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.pyrefly]
preset = "strict"
enable-fallback-search-path = true

[tool.ruff.lint.isort]
known-first-party = ["wanikani_burnt_kanji_to_anki"]
